nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: 
            - '%env(default::CORS_ALLOW_ORIGIN:http://localhost:5173)%'
            - '^https?://localhost(:[0-9]+)?$'
            - '^https?://127\.0\.0\.1(:[0-9]+)?$'
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        expose_headers: ['Link']
        max_age: 3600
        allow_credentials: true
    paths:
        '^/api/': ~
