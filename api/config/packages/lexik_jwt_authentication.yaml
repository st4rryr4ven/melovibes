lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'

    set_cookies:
        BEARER:
            path: /
            domain: null
            http_only: true
            secure: false
            same_site: lax
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
        cookie:
            enabled: true
            name: BEARER
    blocklist_token:
        enabled: true
        cache: cache.app
